name: Visual tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  visual:
    runs-on: ubuntu-latest
    # тот же образ, что и в docker-compose.yml — эталоны совпадают с локальными
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run visual:ci
        env:
          CI: '1'
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
